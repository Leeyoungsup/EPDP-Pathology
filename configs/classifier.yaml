# EPDP — EfficientNetV2-L subtype classifier (EffNet-Real / EffNet-Syn).
# Both classifiers share this configuration; only the training data source
# (real vs. synthetic) differs. The validation set is real images for both.

backbone: tf_efficientnetv2_l    # timm model name
image_feature_dim: 1280
image_size: 512
inch: 3

# Targets per organ (multiclass, one-hot encoded in the script)
breast_classes: [BRNT, BRLC, BRDC, BRIL, BRID]
stomach_classes: [STNT, STIN, STDI, STMX]

# ── Optimization ────────────────────────────────────────────────
optimizer: SAM                   # Sharpness-Aware Minimization (Foret et al., 2021)
base_optimizer: SGD
lr: 2.0e-4
momentum: 0.9
rho: 0.05                        # SAM neighborhood radius
adaptive: false

batch_size: 1
epochs: 1000
loss: cross_entropy              # F.cross_entropy(softmax(logits), one_hot)

# ── Augmentation ────────────────────────────────────────────────
random_horizontal_flip: 0.5
random_vertical_flip: 0.5
normalize_mean: [0.5, 0.5, 0.5]
normalize_std:  [0.5, 0.5, 0.5]

# ── Split ───────────────────────────────────────────────────────
test_size: 0.2
random_state: 42

# Per-class sample counts are taken from manuscript Table 3.
